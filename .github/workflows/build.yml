name: Build catalog frames (GitHub Pages fallback)

# The live build runs on Fly.io (src/server.js). This workflow only runs by hand.
on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Force a theme (blank = use config.json schedule)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # the first run renders every product in every format
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Restore rendered images
        uses: actions/cache/restore@v4
        with:
          path: public/img
          key: frames-${{ github.run_id }}
          restore-keys: frames-

      - run: npm test

      - name: Fetch products (Shopify Admin API)
        run: node src/fetch.js
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}

      # Available straight away for the local Studio (npm run pull), before the render finishes.
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: data/products.json
          retention-days: 7

      - name: Render frames
        run: node src/render.js
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          THEME: ${{ inputs.theme }}
          CONCURRENCY: 8

      # Saved even if a later step fails, so finished renders are never lost.
      - name: Save rendered images
        if: always()
        uses: actions/cache/save@v4
        with:
          path: public/img
          key: frames-${{ github.run_id }}

      - name: Build feed
        run: node src/feed.js
        env:
          SIZE_LIMIT_MB: 950

      - name: Publish hosted Studio
        run: node src/site.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

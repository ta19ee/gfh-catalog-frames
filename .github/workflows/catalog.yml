name: Catalog for the Studio

# Fetches the product catalog only (about a minute) and keeps it as a download, so the local
# Studio can load every product without waiting for a full render. Run it from the Actions tab
# or with: gh workflow run catalog.yml
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch products
        run: node src/fetch.js
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: data/products.json
          retention-days: 7
